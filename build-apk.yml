name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 @capacitor/filesystem@^6 @capacitor/share@^6 @capacitor/local-notifications@^6
          mkdir -p www
          cp index.html www/index.html
          npx cap init Planer ru.planer.app --web-dir=www
          npx cap add android
      - name: Icons and app name
        run: |
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0c2142' --iconBackgroundColorDark '#0c2142' || echo "icons skipped"
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Планер</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Планер</string>#' android/app/src/main/res/values/strings.xml
      - name: Sync and build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: planer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
