document.addEventListener('click',e=>{lastAct=Date.now();if(/^(SELECT|OPTION|INPUT|TEXTAREA)$/.test(e.target.tagName))return;const el=e.target.closest('[data-a]');if(!el)return;
 const f=ACT[el.dataset.a];if(f){try{f(el.dataset,el,e)}catch(x){console.error(x);toast('Ошибка: '+x.message)}}});

 if(el.dataset.a==='stepToggle'||el.dataset.a==='chk'||el.dataset.a==='pomToggle'){ACT[el.dataset.a](el.dataset,el);return}
 if(el.dataset.rr){syncForm();(el.dataset.k?showKpiForm:el.dataset.e?showEvent:showForm)();return}
 if(el.id==='impf'&&el.files[0]){readImport(el.files[0],false);el.value='';return}

 if(el.dataset.flt){const k=el.dataset.flt;if(k==='sDom')S.sDom=el.value;else if(k==='dDom')S.dDom=el.value;else S.f[k]=el.value;render();return}
 if(el.dataset.chg==='status'){setStatus(el.dataset.id,el.value);return}
 if(el.dataset.note){D.notes[el.dataset.note]=el.value;save();return}
 if(el.dataset.path){const t=el.dataset.type;let v=el.value;if(t==='num'){v=parseFloat(v);if(isNaN(v))v=0}else if(t==='chk')v=el.checked;else if(t==='breaks')v=parseBreaks(v);else if(t==='lines')v=v.split('\n').map(x=>x.trim()).filter(Boolean);setP(el.dataset.path,v);
  if(el.dataset.path==='settings.notify'&&v&&window.Notification&&Notification.permission==='default')Notification.requestPermission();
  save();invalidate();if(!mo().classList.contains('on'))render();syncNative()}});

// periodic tick
function tick(){if(!CUR||!D)return;const now=nowMin(),td=todayS(),lead=Math.max(1,+D.settings.leadMin||5);
 if(D.settings.autoLogout>0&&!D.meta.timer&&Date.now()-lastAct>D.settings.autoLogout*60000){lockApp();return}
 let ch=autoEvents();const nt=D.meta.notified;
 ['work','home'].forEach(dom=>{planBlocks(getPlan(dom),dom,td).forEach(b=>{if(b.skipped)return;const dd=b.start-now,id=b.stepId||b.taskId||b.eventId,ttl=(dom==='home'?'[Личное] ':'')+(b.ttitle||b.title);
  if(dd>0&&dd<=lead){const k=td+'|pre|'+b.start+'|'+id;if(!nt[k]){nt[k]=1;ch=true;alertUser('Через '+dd+' мин',ttl+' · '+mt(b.start),'soft')}}
  else if(dd<=0&&dd>-3){const k=td+'|go|'+b.start+'|'+id;if(!nt[k]){nt[k]=1;ch=true;alertUser('Пора начинать',ttl+' · '+mt(b.start),'start')}}})});
 const od=D.tasks.filter(t=>activeT(t)&&t.deadline&&t.deadline<td).length;if(od&&!nt[td+'|od']){nt[td+'|od']=1;ch=true;alertUser('Просрочено задач: '+od,'откройте «Разобрать»','warn')}
 if(kpisDue().length&&!nt[td+'|kpi']&&now>=9*60){nt[td+'|kpi']=1;ch=true;alertUser('Показатели','внесите достигнутые значения за неделю','soft')}
 Object.keys(nt).forEach(k=>{if(k.slice(0,10)<addD(td,-2))delete nt[k]});
 const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
 if(ch){save();invalidate()}syncNative();if(!mo().classList.contains('on')&&!$('#focus').classList.contains('on')&&!typing){invalidate();render()}
 if(D.meta.dayConfirmed&&D.meta.dayConfirmed!==td&&!mo().classList.contains('on'))prompts()}
